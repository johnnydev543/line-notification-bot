services:
  line-notification-bot:
    build: .
    image: line-notification-bot:local
    container_name: line_notification_bot
    restart: unless-stopped
    environment:
      # === LINE Messaging API 憑證 ===
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      # 推播目標（可多個，逗號分隔；相容舊的 LINE_USER_ID）
      - LINE_TARGET_IDS=${LINE_TARGET_IDS:-}
      - LINE_USER_ID=${LINE_USER_ID:-}

      # === 整合模組（Grafana / Prometheus 為選配） ===
      - ENABLED_INTEGRATIONS=${ENABLED_INTEGRATIONS:-}
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_TOKEN=${GRAFANA_TOKEN:-}
      - PROMETHEUS_URLS=${PROMETHEUS_URLS:-http://prometheus:9090}

      # === 通用 /notify 端點的共享密鑰（建議設定） ===
      - NOTIFY_SECRET=${NOTIFY_SECRET:-}

      # === 告警來源標示 / 內網 URL 重寫（deployment-specific） ===
      - ALERT_SOURCES=${ALERT_SOURCES:-}
      - ALERT_URL_REWRITES=${ALERT_URL_REWRITES:-}

      # === 其他 ===
      - TZ=${TZ:-Asia/Taipei}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
